name: Release checks

on:
  pull_request:
    branches: [production, main]
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Core regression tests
        run: npm test
      - name: API and authorization tests
        run: node --test tests/api.test.mjs
      - name: Product and retail pricing tests
        run: node --test tests/product-pricing.test.mjs tests/retail-pricing.test.mjs
      - name: Build production assets
        run: npm run build
